<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - Finova</title>
  
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/topnav.css">
  <link rel="stylesheet" href="/css/profiledropdown.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/loader.css"> 

  <style>
    :root {
      --accent: #475569;
    }

    body {
      /* Added extra padding for mobile breathing room */
      padding-top: 100px; 
      background: #f8fafc;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* FIX: Navbar spans full width and stays on TOP during scroll */
    #topnavContainer {
      width: 100%;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 9999; /* Higher than card and loader */
    }

    .profile-card {
      width: 90%;
      max-width: 420px;
      margin: 20px auto 60px auto; /* Margin bottom for mobile scroll space */
      padding: 30px;
      border-radius: 24px;
      background: #ffffff;
      box-shadow: 0 15px 35px rgba(0,0,0,.04);
      text-align: center;
      box-sizing: border-box; /* Ensures internal alignment is perfect */
    }

    .avatar-large {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #fff;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    h3 {
      margin: 0;
      font-size: 1.4rem;
      color: #1e293b;
      font-weight: 700;
    }

    #userEmail {
      margin: 8px 0 25px 0;
      font-size: 14px;
      color: #64748b;
      word-break: break-all; /* Prevents long emails from breaking mobile layout */
    }

    /* Alignment Box: Locks inputs and buttons to the same width */
    .alignment-box {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: left;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 600;
      color: #334155;
      display: block;
      margin-bottom: 6px;
    }

    input#displayName {
      width: 100%;
      padding: 12px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      font-size: 15px;
      box-sizing: border-box; /* Fixes alignment overflow */
      transition: border-color 0.2s;
    }

    .btn-save {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    hr {
      border: 0;
      border-top: 1px solid #f1f5f9;
      margin: 10px 0;
    }

    .secondary-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-secondary {
      width: 100%;
      padding: 12px;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      color: #64748b;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      box-sizing: border-box;
    }

    .btn-logout {
      color: #ef4444;
      border-color: #fee2e2;
    }

    /* Mobile specific adjustments */
    @media (max-width: 480px) {
      .profile-card {
        padding: 20px;
      }
      body {
        padding-top: 90px;
      }
    }
  </style>
</head>
<body>

  <div id="topnavContainer"></div>

  <div class="profile-card">
    <img id="avatarImg" class="avatar-large" src="https://ui-avatars.com/api/?name=User" alt="Avatar">
    <h3 id="userDisplayName">User</h3>
    <p id="userEmail">user@email.com</p>

    <div class="alignment-box">
      <div class="form-group">
        <label>Display Name</label>
        <input type="text" id="displayName" placeholder="Enter name">
      </div>

      <button class="btn-save" onclick="saveProfile()">Save Changes</button>
      
      <hr>

      <div class="secondary-actions">
        <button class="btn-secondary" onclick="goChangePassword()">Change Password</button>
        <button class="btn-secondary btn-logout" onclick="logout()">Logout</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="/js/supabaseClient.js"></script>
  <script src="/js/topnav.js"></script>
  <script src="/js/profile.js" defer></script>

</body>
</html>
