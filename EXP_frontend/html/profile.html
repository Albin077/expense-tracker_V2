<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile</title>

  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/responsive.css">

  <style>
    body {
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
    }

    .profile-card {
      max-width: 360px;
      margin: auto;
      padding: 20px;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      text-align: center;
    }

    .avatar-wrap {
      position: relative;
      width: 120px;
      height: 120px;
      margin: auto;
    }

    .avatar-wrap img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #ddd;
    }

    .avatar-add {
      position: absolute;
      bottom: 6px;
      right: 6px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #000;
      color: #fff;
      font-size: 18px;
      line-height: 26px;
      cursor: pointer;
    }

    input[type="file"] { display: none; }

    input, button {
      margin-top: 14px;
      width: 100%;
      padding: 10px;
      font-size: 14px;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .loader {
      width: 28px;
      height: 28px;
      border: 3px solid #ddd;
      border-top: 3px solid #000;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 12px auto;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
<div id="profileLoader" class="loader" style="display:none;">
  Loading...
</div>

<div class="profile-card">
  <h3>Account</h3>

  <div class="avatar-wrap">
    <img id="avatarImg"
      src="data:image/svg+xml;utf8,
      <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
        <circle cx='50' cy='35' r='18' fill='%23cbd5e1'/>
        <rect x='18' y='60' width='64' height='35' rx='18' fill='%23cbd5e1'/>
      </svg>">
    <div class="avatar-add" onclick="pickImage()">+</div>
  </div>

  <div id="profileLoader" class="loader"></div>

  <input type="file" id="avatarInput" accept="image/png,image/jpeg,image/webp">

  <input id="nameInput" placeholder="Your name">
  <button onclick="saveName()">Save Name</button>

  <hr>

  <button onclick="location.href='login.html'">Change Password</button>
  <button onclick="logout()">Logout</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabaseClient.js"></script>

<script>
const sb = window.supabaseClient;
const loader = document.getElementById("profileLoader");

const MAX_SIZE_MB = 2;
const ALLOWED_TYPES = ["image/png", "image/jpeg", "image/webp"];

/* --------------------------
   LOAD PROFILE
-------------------------- */
async function loadProfile() {
  loader.style.display = "block";

  const { data: { session } } = await sb.auth.getSession();
  if (!session) return location.href = "login.html";

  nameInput.value = session.user.user_metadata?.name || "";

  if (session.user.user_metadata?.avatar_path) {
    const { data } = await sb.storage
      .from("avatars")
      .createSignedUrl(
        session.user.user_metadata.avatar_path,
        3600
      );

    if (data?.signedUrl) avatarImg.src = data.signedUrl;
  }

  loader.style.display = "none";
}

/* --------------------------
   PICK IMAGE
-------------------------- */
function pickImage() {
  avatarInput.click();
}

/* --------------------------
   UPLOAD AVATAR
-------------------------- */
avatarInput.onchange = async () => {
  const file = avatarInput.files[0];
  if (!file) return;

  if (!ALLOWED_TYPES.includes(file.type)) {
    alert("Only PNG, JPG or WEBP allowed");
    return;
  }

  if (file.size > MAX_SIZE_MB * 1024 * 1024) {
    alert("Max size is 2MB");
    return;
  }

  loader.style.display = "block";

  const { data: { session } } = await sb.auth.getSession();
  if (!session) return;

  const ext = file.name.split(".").pop();
  const path = `${session.user.id}.${ext}`;

  const { error } = await sb.storage
    .from("avatars")
    .upload(path, file, { upsert: true });

  if (error) {
    alert(error.message);
    loader.style.display = "none";
    return;
  }

  await sb.auth.updateUser({
    data: { avatar_path: path }
  });

  const { data } = await sb.storage
    .from("avatars")
    .createSignedUrl(path, 3600);

  avatarImg.src = data.signedUrl;
  loader.style.display = "none";
};

/* --------------------------
   SAVE NAME
-------------------------- */
async function saveName() {
  const name = nameInput.value.trim();
  if (!name) return alert("Name required");

  loader.style.display = "block";
  await sb.auth.updateUser({ data: { name } });
  loader.style.display = "none";

  alert("Profile updated");
}

/* --------------------------
   LOGOUT
-------------------------- */
async function logout() {
  await sb.auth.signOut();
  location.href = "login.html";
}

loadProfile();
</script>

</body>
</html>
