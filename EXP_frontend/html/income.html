<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>Income</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/topnav.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabaseClient.js"></script>
  <script src="/js/income.js" defer></script>
</head>
<body>
<div id="topnavContainer"></div>

<h2>💰 Income</h2>

<a href="home.html">⬅ Back</a>
<br><br>

<!-- SEARCH -->
<input
  type="text"
  id="incomeSearch"
  placeholder="Search source or comment..."
  oninput="loadIncome()"
/>

<br><br>

<!-- SORT TOGGLE -->
<button onclick="toggleSortPanel()">Sort ⚙</button>

<div id="sortPanel" style="display:none; margin-top:10px;">
  <button onclick="setSort('date')">Date</button>
  <button onclick="setSort('amount')">Amount</button>
  <button onclick="toggleOrder()">Asc / Desc</button>
</div>

<br><br>

<!-- MONTH FILTER -->
<select onchange="setMonth(this.value)">
  <option value="">All Months</option>
  <option value="1">Jan</option>
  <option value="2">Feb</option>
  <option value="3">Mar</option>
  <option value="4">Apr</option>
  <option value="5">May</option>
  <option value="6">Jun</option>
  <option value="7">Jul</option>
  <option value="8">Aug</option>
  <option value="9">Sep</option>
  <option value="10">Oct</option>
  <option value="11">Nov</option>
  <option value="12">Dec</option>
</select>

<br><br>

<table border="1">
  <thead>
    <tr>
      <th>Date</th>
      <th>Source</th>
      <th>Amount</th>
      <th>Comment</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody id="incomeBody"></tbody>
</table>
<!-- GLOBAL LOADING OVERLAY -->
<div id="globalLoader" style="
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.3);
  z-index:9999;
  align-items:center;
  justify-content:center;
">
  <div style="
    width:40px;
    height:40px;
    border:4px solid #ddd;
    border-top:4px solid #333;
    border-radius:50%;
    animation: spin 1s linear infinite;
  "></div>
</div>

<style>
@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>

</body>
</html>
