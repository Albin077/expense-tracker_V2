<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Financial Insights</title>

   

    <link rel="stylesheet" href="/css/base.css">

    <link rel="stylesheet" href="/css/topnav.css">

    <link rel="stylesheet" href="/css/profiledropdown.css">

    <link rel="stylesheet" href="/css/analytics.css">

    <link rel="stylesheet" href="/css/loader.css">

    <link rel="stylesheet" href="/css/darkMode.css">
    <script src="/js/darkMode.js" defer></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

   

    <script src="/js/supabaseClient.js"></script>

    <script src="/js/topnav.js"></script>

</head>



<body>

<div id="topnavContainer"></div>

<br>



<div class="analytics-shell">



    <div class="chart-card">

        <div class="card-title">📊 Income vs Expense Trend</div>

        <div class="controls-row">

            <select id="yearSelect"></select>

            <select id="rangeSelect" onchange="loadChart()">

                <option value="12">Full Year</option>

                <option value="6">Last 6 Months</option>

                <option value="3">Last 3 Months</option>

            </select>

            <select id="typeSelect" onchange="loadChart()">

                <option value="bar">Bar Chart</option>

                <option value="line">Line Chart</option>

            </select>

        </div>

        <div class="chart-wrapper">

            <canvas id="incomeExpenseChart"></canvas>

        </div>

    </div>



    <div class="chart-card">

        <div class="card-title">💸 Expense by Category</div>

        <div class="controls-row">

            <input type="date" id="catFrom">

            <input type="date" id="catTo">

            <select id="catType" onchange="loadCategoryChart()">

                <option value="pie">Pie</option>

                <option value="doughnut">Doughnut</option>

                <option value="bar">Bar</option>

                <option value="radar">Radar</option>

            </select>

            <button class="action-btn" onclick="loadCategoryChart()">Apply</button>

        </div>

        <div class="chart-wrapper">

            <canvas id="categoryChart"></canvas>

        </div>

    </div>



    <div class="chart-card">

        <div class="card-header-flex">

            <div class="card-title">💳 Account Spending Analytics</div>

            <div id="accountInsightText" class="total-badge"></div>

        </div>



        <div class="controls-row">

            <input type="date" id="accFrom">

            <input type="date" id="accTo">

            <select id="accType" onchange="loadAccountCharts()">

                <option value="bar">Bar (Distribution)</option>

                <option value="trend">Trend Graph</option>

            </select>

            <button class="action-btn" onclick="loadAccountCharts()">Apply</button>

        </div>



        <div class="chart-wrapper">

            <canvas id="accountDistributionChart"></canvas>

        </div>



        <div class="chart-wrapper">

            <canvas id="accountTrendChart"></canvas>

        </div>

    </div>



    <div class="chart-card">

        <div class="card-header-flex">

            <div class="card-title">🔍 Keyword Search Trend</div>

            <div id="kwTotalDisplay" class="total-badge"></div>

        </div>

        <div class="controls-row">

            <input id="kwInput" placeholder="e.g. food, petrol">

            <input type="date" id="kwFrom">

            <input type="date" id="kwTo">

            <select id="kwType">

                <option value="bar">Bar</option>

                <option value="line">Line</option>

            </select>

            <button class="action-btn" onclick="loadKeywordRangeChart()">Search</button>

        </div>

        <div class="chart-wrapper">

            <canvas id="keywordRangeChart"></canvas>

        </div>

    </div>



    <section class="insights-container">

        <h2>Executive Summary</h2>

        <div class="insights-flex">

            <div class="insight-tile">

                <h3>Monthly Status</h3>

                <p id="incomeExpenseText"></p>

            </div>

            <div class="insight-tile">

                <h3>Spending Alerts</h3>

                <div id="spendingIncreaseText"></div>

            </div>

            <div class="insight-tile wide">

                <h3>Category Distribution</h3>

                <div class="overflow-table">

                    <table class="classic-dark-table">

                        <thead>

                            <tr><th>Category</th><th>Amount</th><th>% of Income</th></tr>

                        </thead>

                        <tbody id="avgExpenseTable"></tbody>

                    </table>

                </div>

            </div>

        </div>

    </section>

</div>



<script src="/js/analytics.js"></script>



</body>

</html>
