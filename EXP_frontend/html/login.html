<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/responsive.css">

  <title>Auth</title>

  <!-- Page-specific styles ONLY -->
  <style>
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;

      /* Neutral background */
      background: linear-gradient(
        135deg,
        #eef0f4,
        #dfe3ea
      );
    }

    /* Frosted glass card */
    .auth-card {
      width: 340px;
      padding: 26px;
      border-radius: 14px;

      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      border: 1px solid rgba(255,255,255,0.4);
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
    }

    /* Input block separation */
    .auth-card input {
      background: rgba(255,255,255,0.75);
      border: 1px solid rgba(0,0,0,0.08);
    }

    .auth-card input:focus {
      background: rgba(255,255,255,0.9);
    }

    h2 {
      text-align: center;
      margin-bottom: 18px;
    }

    .hint {
      text-align: center;
      font-size: 14px;
      margin-top: 14px;
      color: var(--muted);
    }

    .hint a {
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="card auth-card">

  <h2 id="title">Login</h2>

  <!-- ================= LOGIN ================= -->
  <div id="loginBox">
    <input id="loginEmail" type="email" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Password">
    <button onclick="login()">Login</button>

    <div class="hint">
      No account?
      <a onclick="showSignup()">Create account</a>
      <br>
      <a onclick="showChange()">Forgot / Change password?</a>
    </div>
  </div>

  <!-- ================= SIGNUP ================= -->
  <div id="signupBox" class="hidden">
    <input id="signupEmail" type="email" placeholder="Email">
    <input id="signupPassword" type="password" placeholder="Password">
    <button onclick="signup()">Create Account</button>

    <div class="hint">
      Already have an account?
      <a onclick="showLogin()">Log in</a>
    </div>
  </div>

  <!-- ============== CHANGE PASSWORD ============== -->
  <div id="changeBox" class="hidden">
    <input id="changeEmail" type="email" placeholder="Email">
    <input id="currentPassword" type="password" placeholder="Current password">
    <input id="newPassword" type="password" placeholder="New password">
    <button onclick="changePassword()">Change Password</button>

    <div class="hint">
      <a onclick="showLogin()">← Back to login</a>
    </div>
  </div>

  <div id="status" class="status"></div>
</div>

<!-- ================= SCRIPTS ================= -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabaseClient.js"></script>
<script src="/js/auth.js"></script>

<!-- ================= GLOBAL LOADER ================= -->
<div id="globalLoader" style="
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.3);
  z-index:9999;
  align-items:center;
  justify-content:center;
">
  <div style="
    width:40px;
    height:40px;
    border:4px solid #ddd;
    border-top:4px solid #333;
    border-radius:50%;
    animation: spin 1s linear infinite;
  "></div>
</div>

<style>
@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>

</body>
</html>
