<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/darkMode.css">
    <script src="/js/darkMode.js" defer></script>
    <title>Auth</title>
</head>
<body>

<div class="auth-wrapper">
    <div class="close-btn" onclick="closeAuth()">✕</div>

    <div class="auth-card">
        <h2 id="title">Login</h2>

        <div id="loginBox">
            <span class="input-label">Username</span>
            <input id="loginEmail" type="email" placeholder="example@test.com">
            
            <span class="input-label">Password</span>
            <input id="loginPassword" type="password" placeholder=".......">
            
            <button onclick="login()">Sign In</button>

            <div class="hint">
                Forget Password ? <a onclick="forgotPassword()">Click Here!</a>
                <a class="signup-link" onclick="showSignup()">Register / Sign Up</a>
            </div>
        </div>

        <div id="signupBox" class="hidden">
            <span class="input-label">Email</span>
            <input id="signupEmail" type="email" placeholder="Email">
            
            <span class="input-label">Password</span>
            <input id="signupPassword" type="password" placeholder="Password">
            
            <span class="input-label">Confirm Password</span>
            <input id="signupConfirmPassword" type="password" placeholder="Repeat Password">
            
            <button onclick="signup()">Create Account</button>

            <div class="hint">
                Already have an account?
                <a class="signup-link" onclick="showLogin()">Log in</a>
            </div>
        </div>

        <div id="changeBox" class="hidden">
            <span class="input-label">Email</span>
            <input id="changeEmail" type="email" placeholder="Email">
            
            <span class="input-label">New Password</span>
            <input id="newPassword" type="password" placeholder="New password">
            
            <span class="input-label">Confirm New Password</span>
            <input id="confirmNewPassword" type="password" placeholder="Repeat new password">
            
            <button onclick="changePassword()">Change Password</button>

            <div class="hint">
                <a class="signup-link" onclick="showLogin()">← Back to login</a>
            </div>
        </div>

        <div id="status" class="status"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabaseClient.js"></script>
<script src="/js/auth.js"></script>
<script>
    function closeAuth() {
        const card = document.querySelector('.auth-card');
        card.classList.add('closing');
        setTimeout(() => { 
            window.location.href = "/html/home.html"; 
        }, 280);
    }
</script>

</body>
</html>
