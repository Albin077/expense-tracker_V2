<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Home</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="/css/topnav.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/autocomplete.css">
<link rel="stylesheet" href="/css/responsive.css">
<link rel="stylesheet" href="/css/profiledropdown.css">

<style>
@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
</style>
</head>

<body>

<!-- ✅ Dynamic Top Navigation -->
<div id="topnavContainer"></div>

<h3>Add Expense</h3>

<input id="expDate" type="date">
<input id="expCategory" placeholder="Category">
<div id="expCategoryList" class="autocomplete-list"></div>
<input id="expAmount" type="number" placeholder="Amount">
<input id="expComment" placeholder="Comment">
<button onclick="addExpense(this)">Add Expense</button>

<hr>

<h3>Add Income</h3>

<input id="incDate" type="date">
<input id="incSource" placeholder="Source">
<div id="incSourceList" class="autocomplete-list"></div>
<input id="incAmount" type="number" placeholder="Amount">
<input id="incComment" placeholder="Comment">
<button onclick="addIncome(this)">Add Income</button>

<hr>

<a href="expenses.html">Expenses</a> |
<a href="income.html">Income</a> |
<a href="analytics.html">Analytics</a>

<!-- ✅ Profile dropdown HTML will be injected here -->
<div id="sidebarContainer"></div>

<!-- GLOBAL LOADER -->
<div id="globalLoader"
  style="
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.3);
    z-index:9999;
    align-items:center;
    justify-content:center;
  "
>
  <div style="
    width:40px;
    height:40px;
    border:4px solid #ddd;
    border-top:4px solid #333;
    border-radius:50%;
    animation: spin 1s linear infinite;
  "></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabaseClient.js"></script>

<!-- ⚠️ IMPORTANT: topnav.js must load BEFORE home.js -->
<script src="/js/topnav.js"></script>
<script src="/js/home.js"></script>

</body>
</html>
