<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="/css/topnav.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/autocomplete.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <link rel="stylesheet" href="/css/profiledropdown.css">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/loader.css">
    <link rel="stylesheet" href="/css/darkMode.css">
    <script src="/js/darkMode.js" defer></script>

    <script src="/js/topnav.js"></script>
</head>

<body>
<div id="topnavContainer"></div>
<br></br>
<br></br>
<div class="split-layout">

    <!-- LEFT BRAND -->
    <div class="brand-panel">
        <div class="brand-content">
            <h1 class="designer-title">⌘ FINOVA</h1>
            <h2 class="brand-main">Personal Finance Intelligence</h2>

            <p class="subtitle">
                FINOVA helps you analyse, track and manage your personal finances with clarity.
            </p>

            <p class="quote">
                “Do not save what is left after spending, but spend what is left after saving.”
                <span class="quote-author">— Warren Buffett</span>
            </p>
        </div>
    </div>

    <!-- RIGHT FORM PANEL -->
    <div class="forms-panel">

        <div class="mobile-tabs">
            <button onclick="showForm('expense')" class="active" id="tab-exp">Expense</button>
            <button onclick="showForm('income')" id="tab-inc">Income</button>
        </div>

        <!-- ================= EXPENSE ================= -->
        <div class="premium-card form-box" id="expenseBox">
            <div class="card-title">Add Expense</div>

            <!-- DATE -->
            <input id="expDate" type="date">

            <!-- CATEGORY AUTOCOMPLETE -->
            <div class="autocomplete-wrapper">
                <input id="expCategory" placeholder="Category">
                <div id="expCategoryList" class="autocomplete-list"></div>
            </div>

            <!-- AMOUNT -->
            <input id="expAmount" type="number" placeholder="Amount">

            <!-- COMMENT -->
            <input id="expComment" placeholder="Comment">

            <!-- ACCOUNT AUTOCOMPLETE (NEW) -->
            <div class="autocomplete-wrapper">
                <input id="expAccount" placeholder="Account">
                <div id="expAccountList" class="autocomplete-list"></div>
            </div>

            <button class="main-btn" onclick="addExpense(this)">Add Expense</button>
        </div>

        <!-- ================= INCOME ================= -->
        <div class="premium-card form-box" id="incomeBox">
            <div class="card-title">Add Income</div>

            <input id="incDate" type="date">

            <div class="autocomplete-wrapper">
                <input id="incSource" placeholder="Source">
                <div id="incSourceList" class="autocomplete-list"></div>
            </div>

            <input id="incAmount" type="number" placeholder="Amount">
            <input id="incComment" placeholder="Comment">

            <button class="main-btn" onclick="addIncome(this)">Add Income</button>
        </div>

    </div>
</div>
<div id="globalLoader">
    <div class="spinner"></div>
</div>
<script>
function showForm(type){
    if(window.innerWidth > 900) return;

    const exp=document.getElementById("expenseBox");
    const inc=document.getElementById("incomeBox");
    const t1=document.getElementById("tab-exp");
    const t2=document.getElementById("tab-inc");

    if(type==="expense"){
        exp.style.display="flex";
        inc.style.display="none";
        t1.classList.add("active");
        t2.classList.remove("active");
    }else{
        inc.style.display="flex";
        exp.style.display="none";
        t2.classList.add("active");
        t1.classList.remove("active");
    }
}
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabaseClient.js"></script>
<script src="/js/home.js"></script>

</body>
</html>
