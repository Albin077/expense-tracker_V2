<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/topnav.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/autocomplete.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <link rel="stylesheet" href="/css/profiledropdown.css">
    <style>
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
    <script src="/js/topnav.js"></script>
</head>
<body>

<div id="topnavContainer"></div>

<div class="content-wrapper">
    <h3 class="section-title">Add Expense</h3>
    <div class="form-card">
        <input id="expDate" type="date">
        <div class="autocomplete-wrapper">
            <input id="expCategory" placeholder="Category">
            <div id="expCategoryList" class="autocomplete-list"></div>
        </div>
        <input id="expAmount" type="number" placeholder="Amount">
        <input id="expComment" placeholder="Comment">
        <button class="main-btn" onclick="addExpense(this)">Add Expense</button>
    </div>

    <div class="divider"></div>

    <h3 class="section-title">Add Income</h3>
    <div class="form-card">
        <input id="incDate" type="date">
        <div class="autocomplete-wrapper">
            <input id="incSource" placeholder="Source">
            <div id="incSourceList" class="autocomplete-list"></div>
        </div>
        <input id="incAmount" type="number" placeholder="Amount">
        <input id="incComment" placeholder="Comment">
        <button class="main-btn" onclick="addIncome(this)">Add Income</button>
    </div>

    <div class="footer-links">
        <a href="expenses.html">Expenses</a> |
        <a href="income.html">Income</a> |
        <a href="analytics.html">Analytics</a>
    </div>
</div>

<div id="sidebarContainer"></div>

<div id="globalLoader" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.2); z-index:9999; align-items:center; justify-content:center;">
    <div style="width:40px; height:40px; border:4px solid #ddd; border-top:4px solid var(--accent); border-radius:50%; animation: spin 1s linear infinite;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabaseClient.js"></script>
<script src="/js/home.js"></script>

</body>
</html>
